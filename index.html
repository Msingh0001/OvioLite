<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050403">
<style>@media (max-width:619px){.status{visibility:hidden}}html,body{margin:0;height:100%}[hidden]{display:none!important}img{max-width:100%}</style>
<title>OVIO Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* OVIO, rebuilt from the SwiftUI source: one phone screen, a frame on wide screens, full-bleed on phones.
   Single dark look on purpose (the app forces dark). Serif = Apple's New York, approximated with Source Serif 4. */
:root{
  color-scheme:dark;
  --ground:#090806; --smoked:#070605; --warmblack:#0D0A08; --bar:#0E0C0A; --base:#14100A; --midnight:#1F1810;
  --champ:#CCB38F; --hi:#FACC8C; --wgold:#D1944D; --bronze:#917A5C; --bdeep:#704521; --ivory:#E8E0D1; --gold:#D1A24A;
  --stone:#B8B0A3; --tprim:#F5E8D0; --tsec:#BCAA8E; --muted:#B3A087; --faint:#93836B; --amber:#E5B96F; --clay:#C97B54;
  --w94:rgba(255,255,255,.94); --w60:rgba(255,255,255,.60); --w39:rgba(255,255,255,.39);
  --serif:'Source Serif 4','New York','Iowan Old Style',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --round:ui-rounded,'SF Pro Rounded',-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%}
body{background:#050403;color:var(--w94);font-family:var(--serif);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}
.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.i.f{fill:currentColor;stroke:none}

/* ── phone ── */
.phone{position:relative;width:100%;height:100%;background:var(--base);overflow:hidden;overflow:clip;isolation:isolate}
.sfade{position:absolute;top:0;left:0;right:0;height:56px;z-index:70;pointer-events:none;background:linear-gradient(180deg,rgba(9,8,6,.85),rgba(9,8,6,0))}
.caption{display:none}
@media (min-width:620px){
  body{padding-block:18px;gap:12px}
  .phone{width:393px;height:min(852px,calc(100% - 34px));border-radius:54px;box-shadow:0 0 0 11px #0b0a09,0 0 0 12px #2b2219,0 40px 90px rgba(0,0,0,.7)}
  .island{display:block!important}
  .caption{display:block;font-family:var(--sans);font-size:12px;color:#7d7060;letter-spacing:.02em}
}
.island{display:none;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:90}
.status{position:absolute;top:0;left:0;right:0;height:50px;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-family:var(--sans);font-weight:600;font-size:15.5px;color:#fff;pointer-events:none}
.status .r{display:flex;gap:6px;align-items:center}

.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:84px}
.screen::-webkit-scrollbar{display:none}
.screen[hidden]{display:none!important}

/* ── shared gold language ── */
.mrim{position:relative}
.mrim::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--rw,.8px);pointer-events:none;opacity:var(--ro,.54);
  background:linear-gradient(135deg,rgba(250,204,140,.92) 0%,rgba(255,255,255,.42) 10%,rgba(209,148,77,.30) 31%,rgba(255,255,255,.08) 53%,rgba(112,69,33,.45) 74%,rgba(250,204,140,.60) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.trim{position:relative}
.trim::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--rw,1px);pointer-events:none;
  background:linear-gradient(180deg,rgba(255,230,179,calc(.95*var(--k))) 0%,rgba(204,179,143,calc(.66*var(--k))) 10%,rgba(145,122,92,calc(.34*var(--k))) 44%,rgba(117,84,43,calc(.58*var(--k))) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.optical{--p:.7;--acc:209,148,77;border-radius:20px;
  background:
    radial-gradient(150px 150px at 0 0,rgba(var(--acc),calc(.16*var(--p))),transparent 100%),
    radial-gradient(125px 125px at 100% 100%,rgba(250,204,140,calc(.08*var(--p))),transparent 100%),
    linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(250,204,140,.025) 18%,transparent 42%),
    linear-gradient(135deg,rgba(46,33,20,calc(.5*var(--p))) 0%,rgba(7,6,5,.2) 46%,rgba(31,20,11,calc(.38*var(--p))) 100%),
    rgba(10,8,6,.72);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 8px 15px rgba(var(--acc),calc(.07*var(--p))),0 7px 12px rgba(0,0,0,.44)}
.optical.mrim{--ro:calc(.54*var(--p))}
.label{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:600;letter-spacing:1.9px;color:rgba(204,179,143,.80)}
.label::after{content:"";flex:1;height:.7px;background:linear-gradient(90deg,rgba(204,179,143,.32),rgba(255,255,255,.07),transparent)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:58px;border-radius:19px;color:var(--w94);font-size:17px;font-weight:600;
  background:linear-gradient(180deg,rgba(255,255,255,.20),transparent 50%,rgba(0,0,0,.12)),linear-gradient(135deg,#664526 0%,#916336 43%,#6E4A29 100%);
  box-shadow:0 8px 18px rgba(209,148,77,.22),0 6px 9px rgba(0,0,0,.45);--ro:1;--rw:1.1px}
.gbtn:active,.press:active{transform:scale(.98);filter:brightness(1.05)}
.gbtn .i{font-size:17px;stroke-width:1.2}
.handle{width:36px;height:4px;border-radius:2px;margin:10px auto 0;background:linear-gradient(90deg,rgba(255,255,255,.62),rgba(204,179,143,.45));box-shadow:0 0 5px rgba(204,179,143,.12)}
.attr{font-family:var(--sans);font-size:11px;color:rgba(235,235,245,.6);text-align:center}
.attr b{color:#fff;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:9px;font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.2px;white-space:nowrap}
.pill .i{font-size:9px}

/* ── HOME ── */
.wall{position:absolute;inset:0;background:center top/cover no-repeat;z-index:0}
.wall::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.10)}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(180deg,transparent 0%,rgba(9,8,6,.28) 45%,rgba(9,8,6,.62) 100%)}
#home .col{position:relative;z-index:1;padding:0 20px 8px}
.brand{height:330px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:118px}
.brand .wm{font-size:25px;letter-spacing:6.75px;padding-left:6.75px;background:linear-gradient(180deg,rgba(232,224,209,.96),rgba(204,179,143,.90),rgba(112,69,33,.80));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 11px rgba(0,0,0,.48))}
.brand .tag{margin-top:16px;font-size:30px;letter-spacing:-.35px;color:rgba(232,224,209,.96);text-shadow:0 4px 13px rgba(0,0,0,.52)}
.search{position:relative;border-radius:28px}
.search .halo{position:absolute;inset:-6px;border-radius:34px;background:rgba(255,255,255,.072);filter:blur(24px)}
.search .ring{position:relative;border-radius:28px;padding:0;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 40%)}
.search .ring::after{content:"";position:absolute;inset:0;border-radius:28px;padding:.5px;background:linear-gradient(180deg,rgba(255,255,255,.31),rgba(255,255,255,.064));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.search .pillbox{display:flex;align-items:center;gap:12px;height:52px;padding:0 8px 0 16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 50%,transparent),linear-gradient(180deg,rgba(255,255,255,.06),transparent 40%),rgba(20,16,10,.55);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16)}
.search .i{font-size:16px;color:rgba(255,255,255,.65);stroke-width:1.8}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font-family:var(--sans);font-size:15px;font-weight:500;caret-color:var(--gold)}
.lead{font-size:15px;color:rgba(232,224,209,.92);margin:0}
.panel{border-radius:16px;background:rgba(255,255,255,.04);padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.prow{display:flex;gap:12px;align-items:flex-start}
.sdisc{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-size:15px;font-weight:700}
.pmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pl1{display:flex;align-items:center;gap:6px}
.pl1 .nm{flex:1;min-width:0;font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl1 .now{font-family:var(--sans);font-size:10px;font-weight:700;color:rgba(255,255,255,.30)}
.pl2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--sans);font-size:10px}
.prov{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;margin-top:1px;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06);font-family:var(--sans);font-size:10px;color:var(--muted)}
.prov i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.30)}
.bm{flex:none;width:28px;height:28px;display:grid;place-items:center;color:rgba(255,255,255,.45)}
.bm .i{font-size:16px;stroke-width:1.9}
.whyrow{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;width:100%;font-size:13px;color:rgba(232,224,209,.86)}
.whyrow .i{margin-left:auto;font-size:11px;color:rgba(204,179,143,.62)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{display:flex;align-items:center;gap:11px;min-height:76px;padding:12px 15px;border-radius:21px;text-align:left;font-size:15px;color:var(--ivory);line-height:1.2;
  background:radial-gradient(150px 150px at 0 0,rgba(209,148,77,.065),transparent),linear-gradient(135deg,rgba(13,10,8,.30),rgba(7,6,5,.18)),rgba(0,0,0,.49);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 0 0 .75px rgba(255,255,255,.11),0 7px 13px rgba(0,0,0,.38)}
.tile:active{transform:scale(.992);box-shadow:inset 0 0 0 .8px rgba(204,179,143,.42)}
.tile .disc{flex:none;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 .65px rgba(255,255,255,.14);color:rgba(204,179,143,.84)}
.tile .disc .i{font-size:15.5px;stroke-width:1.2}

/* day curve */
.dc-head{display:flex;justify-content:space-between;align-items:baseline}
.dc-head .a{font-size:10px;font-weight:600;letter-spacing:1.8px;color:rgba(250,204,140,.82)}
.dc-head .b{font-size:9px;font-weight:500;letter-spacing:1.25px;color:var(--w39)}
.dc-plot{margin-top:10px;height:142px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,rgba(209,148,77,.045),transparent 50%,rgba(255,255,255,.018)),rgba(0,0,0,.18);box-shadow:inset 0 0 0 .65px rgba(255,255,255,.055)}
.dc-plot svg{width:100%;height:100%}
.dc-ins{display:flex;align-items:center;gap:8px;height:18px;margin-top:10px;font-size:12.5px;color:var(--w60)}
.dc-ins::before{content:"";width:18px;height:1px;border-radius:1px;background:rgba(250,204,140,.38)}
.reveal{animation:revealx .72s ease-out both}
@keyframes revealx{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.nowdot{animation:nowpulse 2.8s ease-in-out infinite}
@keyframes nowpulse{50%{r:4px}}

/* ── DISCOVER ── */
#discover{background:var(--ground);padding-top:50px}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 16px 6px}
.topbar h2{flex:1;margin:0;font-size:20px;font-weight:400;letter-spacing:.25px;color:var(--ivory)}
.ctl{width:44px;height:44px;display:grid;place-items:center}
.ctl span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;position:relative;background:linear-gradient(180deg,#0F0C0A,#0A0907);box-shadow:0 3px 7px rgba(0,0,0,.30);--k:.30;--rw:.7px}
.ctl.on span{--k:.70;box-shadow:0 0 6px rgba(204,179,143,.16),0 3px 7px rgba(0,0,0,.30)}
.ctl:active span{transform:scale(.94);opacity:.82}
.ctl .i{color:rgba(204,179,143,.72);stroke-width:1.2}
.weather{position:relative;margin:4px 18px 0;height:110px;border-radius:18px;overflow:hidden;background:#222 center/cover;box-shadow:0 7px 14px rgba(0,0,0,.34);--ro:.42}
.weather::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.52))}
.weather .row{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end}
.weather .l{font-size:11px;color:rgba(255,255,255,.72)}
.weather .t{font-size:12px;color:rgba(255,255,255,.80)}
.banner{display:flex;align-items:center;gap:8px;margin:12px 18px 0;padding:10px 14px;border-radius:14px;background:linear-gradient(180deg,#151110,#0D0B09 45%,#080605);--k:.56;--rw:.9px}
.banner .i{font-size:12px;color:rgba(204,179,143,.9)}
.banner .t{flex:1;font-size:11px;letter-spacing:.3px;color:rgba(232,224,209,.86)}
.banner button{font-size:10px;color:rgba(184,176,163,.62)}
.calmer{display:flex;align-items:center;gap:12px;margin:12px 24px 0;padding:15px 17px;border-radius:17px;width:calc(100% - 48px);text-align:left;
  background:linear-gradient(135deg,rgba(209,162,74,.055),rgba(255,255,255,.012)),rgba(255,255,255,.025);box-shadow:inset 0 0 0 .8px rgba(209,162,74,.15),0 7px 14px rgba(0,0,0,.18)}
.calmer .ic{font-size:17px;color:rgba(209,162,74,.88)}
.calmer .t1{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.15px;color:rgba(255,255,255,.96)}
.calmer .t2{margin-top:5px;font-family:var(--sans);font-size:13px;color:var(--muted)}
.calmer .t2 b{font-weight:500;color:rgba(209,162,74,.78)}
.calmer .ch{margin-left:auto;font-size:13px;color:rgba(147,131,107,.8);stroke-width:2.2}
.stage{position:relative;margin:12px 18px 0}
.scard{position:absolute;left:0;right:0;top:0;border-radius:26px;padding:20px;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform;overflow:hidden;
  background:radial-gradient(170px 170px at 100% 0,rgba(var(--acc),.16),transparent),radial-gradient(145px 145px at 0 100%,rgba(209,148,77,.09),transparent),linear-gradient(180deg,#1B1610 0%,#100D0A 42%,#080605 100%);
  box-shadow:inset 0 1px 0 rgba(255,235,194,.32),0 9px 19px rgba(209,148,77,.11),0 9px 15px rgba(0,0,0,.52);--ro:.72;--rw:.9px}
.scard .dim{position:absolute;inset:0;border-radius:26px;background:#000;pointer-events:none}
.scard .ov{font-size:11px;font-weight:500;letter-spacing:3.4px;color:rgba(204,179,143,.66)}
.scard .vn{margin-top:18px;font-size:25px;font-weight:500;line-height:1.15;color:var(--w94);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .dr{margin-top:7px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--w60)}
.rbox{margin-top:16px;padding:13px 14px;border-radius:16px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 .65px rgba(204,179,143,.12)}
.rbox .h{font-size:11px;font-weight:500;letter-spacing:1.15px;color:rgba(204,179,143,.72)}
.rbox p{margin:7px 0 0;font-size:14px;line-height:1.4;color:var(--w60);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scard .tags{margin-top:10px;font-size:10px;font-weight:500;letter-spacing:1.15px;color:rgba(204,179,143,.68);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .ft{margin-top:12px;display:flex;align-items:center;gap:10px}
.scard .vd{font-size:13px;font-weight:500;color:var(--w60);display:flex;align-items:center;gap:10px}
.scard .vd .i{font-size:12px;color:rgba(204,179,143,.72);stroke-width:1.3}
.hcap{margin-left:auto;display:flex;align-items:center;gap:7px;height:38px;padding:0 11px 0 7px;border-radius:19px;font-size:12px;font-weight:600;color:rgba(255,255,255,.87);
  background:radial-gradient(70px 70px at 0 50%,rgba(209,148,77,.10),transparent),linear-gradient(135deg,rgba(27,22,16,.92),rgba(0,0,0,.54));--ro:.62;--rw:.75px}
.hcap .c{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(209,148,77,.17),rgba(0,0,0,.24));box-shadow:inset 0 0 0 .6px rgba(204,179,143,.20);color:rgba(204,179,143,.92)}
.hcap .c .i{font-size:11px;stroke-width:1.8}
.bmk{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.20);box-shadow:inset 0 0 0 .7px rgba(255,255,255,.12);color:var(--w60)}
.bmk .i{font-size:16px;stroke-width:1.2}
.bmk.on{color:var(--champ);box-shadow:inset 0 0 0 .7px rgba(204,179,143,.5)}
.medal{flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:27px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--w94);
  background:radial-gradient(58px 58px at 0 0,rgba(var(--acc),.18),transparent),rgba(0,0,0,.22);box-shadow:0 4px 10px rgba(var(--acc),.13);--ro:.72;--rw:.85px}
.medal.none{color:var(--w60);box-shadow:none;--ro:.34}
.pbadge{display:inline-flex;align-items:center;gap:6px;height:20px;min-width:20px;justify-content:center;border-radius:10px;background:rgba(209,162,74,.14);box-shadow:inset 0 0 0 .5px rgba(209,162,74,.40),0 0 3px rgba(209,162,74,.30);color:#D1A24A;font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.2px;transition:padding .2s}
.pbadge .i{font-size:9px}
.pbadge.open{padding:0 8px;background:rgba(209,162,74,.10)}
.pbadge.surp{color:#C9A063;background:rgba(201,160,99,.14)}
.hint{text-align:center;font-size:11px;letter-spacing:.45px;color:var(--w60);line-height:22px;transition:opacity .22s}
.gfoot{margin:6px 0 0}
.medallion-load{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:60px}
.medallion-load .m{width:104px;height:104px;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle,rgba(209,148,77,.22),rgba(13,10,8,.9) 60%,rgba(7,6,5,.97));box-shadow:0 0 22px rgba(209,148,77,.22);animation:breathe 3.2s ease-in-out infinite;--ro:1;--rw:1.25px}
.medallion-load .orbit{position:absolute;inset:7px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.medallion-load .arc{position:absolute;inset:7px;animation:spin 3s linear infinite}
.medallion-load p{margin:0;font-size:15px;color:rgba(255,255,255,.58)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.025)}}
.endcard{position:relative;margin:0 18px;padding:32px;border-radius:26px;text-align:center;background:radial-gradient(180px 180px at 50% 0,rgba(209,148,77,.12),transparent),linear-gradient(180deg,#1B1610,#100D0A 42%,#080605);--ro:.7}
.endcard .ck{width:62px;height:62px;margin:0 auto;border-radius:50%;display:grid;place-items:center;color:var(--champ);box-shadow:inset 0 0 0 .8px rgba(204,179,143,.4)}
.endcard h3{margin:18px 0 0;font-size:24px;font-weight:500;color:var(--ivory)}

.tier.primary{--k:1;--rw:1px;background:linear-gradient(180deg,#1B1610,#100D0A 42%,#080605);box-shadow:0 0 8px rgba(204,179,143,.20),0 8px 22px rgba(204,179,143,.085)}
.tier.secondary{--k:.56;--rw:.9px;background:linear-gradient(180deg,#15110D,#0D0B09 45%,#080605);box-shadow:0 0 4px rgba(204,179,143,.045),0 6px 14px rgba(0,0,0,.30)}
.tier.quiet{--k:.26;--rw:.7px;background:linear-gradient(180deg,#0F0D0A,#0A0907);box-shadow:0 4px 9px rgba(0,0,0,.22)}
.svc{display:flex;align-items:center;gap:16px;min-height:94px;padding:16px 14px 16px 16px;width:100%;text-align:left}
.svc:active{transform:scale(.992)}
.shield{flex:none;position:relative;width:52px;height:52px;display:grid;place-items:center}
.shield .core{position:absolute;inset:1px;border-radius:50%;background:radial-gradient(31px 31px at 20% 20%,rgba(var(--acc),.12),rgba(145,122,92,.035) 70%,transparent),#0A0907;box-shadow:inset 0 0 0 .65px rgba(255,255,255,.10)}
.shield .gl{position:absolute;width:22px;height:22px;border-radius:50%;background:rgb(var(--acc));filter:blur(7px);opacity:.38}
.shield .i{position:relative;font-size:15px;color:rgba(var(--acc),.94);filter:drop-shadow(0 0 5px rgba(var(--acc),.28))}
.shield.live .gl,.shield.live .i{animation:shb 2.8s ease-in-out infinite}
@keyframes shb{50%{transform:scale(1.12)}}
.svc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.svc .tx b{font-size:18px;font-weight:500;color:var(--ivory);line-height:1.2}
.svc .tx span{font-size:13px;color:rgba(184,176,163,.76)}
.svc .tx small{font-family:var(--round);font-size:11px;font-weight:500;letter-spacing:1.35px}
.svc .ch{flex:none;font-size:14px;color:rgba(184,176,163,.46);stroke-width:1.2}
.sfoot{text-align:center;padding:42px 0 30px;display:flex;flex-direction:column;gap:10px;align-items:center}
.sfoot .o{font-size:12px;font-weight:500;letter-spacing:4.2px;color:rgba(204,179,143,.52)}
.sfoot .p{font-size:13px;color:rgba(184,176,163,.42)}
.sempty{margin:24px 20px 0;padding:28px 24px;border-radius:20px;text-align:center}
.sempty .ic{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 .7px rgba(204,179,143,.42);color:rgba(204,179,143,.82)}
.sempty .ic .i{font-size:25px;stroke-width:1.1}
.sempty h3{margin:22px 0 0;font-size:20px;font-weight:400;color:var(--ivory)}
.sempty p{margin:10px 0 0;font-size:13px;line-height:1.7;color:rgba(184,176,163,.82)}
.sempty .go{margin-top:26px;width:100%;height:48px;border-radius:20px;font-size:14px;font-weight:500;color:var(--ivory);background:rgba(145,122,92,.22)}

/* ── VOUCH / PERSONA rows ── */
.shdr{text-align:center;padding:22px 0 20px}
.shdr h3{margin:0;font-size:25px;font-weight:400;color:var(--w94)}
.shdr .v{margin-top:5px;font-size:13px;font-weight:500;color:rgba(250,204,140,.82)}
.shdr .s{margin-top:5px;font-size:11px;color:var(--w39)}
.hair{height:.6px;background:linear-gradient(90deg,transparent,rgba(250,204,140,.20),rgba(255,255,255,.07),transparent)}
.vrow{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 16px;width:100%;text-align:left;--p:.46}
.vrow.sel{--p:.84}
.vrow .dk{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 0 0,rgba(var(--oc),.06),rgba(7,6,5,.94) 70%);color:var(--w60);--ro:.34;--rw:.7px}
.vrow.sel .dk{background:radial-gradient(circle at 0 0,rgba(var(--oc),.22),rgba(7,6,5,.94) 70%);color:var(--hi);--ro:.72;box-shadow:0 0 8px rgba(var(--oc),.13)}
.vrow .dk .i{font-size:18px;stroke-width:1.2}
.vrow .tx{flex:1;min-width:0}
.vrow .tx b{display:block;font-size:17px;font-weight:500;color:var(--w94);line-height:1.25}
.vrow .tx span{display:block;margin-top:4px;font-size:11px;color:var(--w60);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow.sel .tx span{color:rgba(250,204,140,.78)}
.vrow .tx span.up{font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--w39)}
.radio{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 .8px rgba(255,255,255,.39);display:grid;place-items:center}
.vrow.sel .radio{background:var(--hi);box-shadow:none;color:#1F1A14}
.radio .i{font-size:10px;stroke-width:3;opacity:0}
.vrow.sel .radio .i{opacity:1}
.more{display:flex;align-items:center;justify-content:center;gap:4px;min-height:46px;margin-top:5px;width:100%;font-size:12px;font-weight:500;color:var(--w60)}
.more .i{font-size:9px;color:rgba(250,204,140,.58);stroke-width:2}
.slrow{padding:14px 16px;--p:.62}
.slrow b{display:block;font-size:15px;font-weight:500;letter-spacing:-.15px;color:var(--w94)}
.slrow .ends{display:flex;justify-content:space-between;margin-top:3px;font-size:11px;letter-spacing:.15px;color:var(--w60)}
.gslider{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:5px 0 0;background:transparent;--v:50%}
.gslider::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:linear-gradient(90deg,#C7B69A 0,#F1E4CB calc(var(--v)*.42),#DAC29C calc(var(--v)*.72),#B59365 var(--v),#2F2C29 var(--v)),#36312D;box-shadow:inset 0 0 0 4px #36312D,0 3px 6px rgba(0,0,0,.32)}
.gslider::-moz-range-track{height:14px;border-radius:7px;background:#2F2C29;box-shadow:0 3px 6px rgba(0,0,0,.32)}
.gslider::-moz-range-progress{height:6px;border-radius:3px;background:linear-gradient(90deg,#C7B69A,#F1E4CB 42%,#DAC29C 72%,#B59365)}
.gslider::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFF8E7 0%,#F1DEBB 26%,#CBA676 62%,#3C2618 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 3px 6px rgba(0,0,0,.45)}
.gslider::-moz-range-thumb{width:32px;height:32px;border:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFF8E7 0%,#F1DEBB 26%,#CBA676 62%,#3C2618 100%);box-shadow:0 3px 6px rgba(0,0,0,.45)}
.sbar{position:sticky;bottom:0;display:flex;gap:12px;padding:12px 0 10px;margin:0 -18px;padding-inline:18px;background:linear-gradient(180deg,rgba(7,6,5,.18),rgba(7,6,5,.94) 50%)}
.sbar .gbtn{height:54px;border-radius:18px;font-size:15px}
.sbar .sec{flex:none;width:38%;height:54px;border-radius:18px;font-size:14px;font-weight:500;color:var(--w60);--p:.58}
.noted{display:flex;align-items:center;gap:12px;margin-top:12px;padding:9px 6px 9px 16px;border-radius:18px;--p:.72}
.noted b{display:block;font-size:15px;font-weight:500;color:var(--w94)}
.noted span{font-size:11px;color:var(--w60)}
.noted button{margin-left:auto;min-height:48px;padding:0 14px;font-size:13px;font-weight:600;letter-spacing:.4px}
.counter{display:flex;align-items:center;gap:6px;padding:16px 4px 14px}
.counter i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.21)}
.counter i.on{background:rgba(250,204,140,.90);box-shadow:0 0 5px rgba(209,148,77,.24)}
.counter span{padding-left:4px;font-size:12px;letter-spacing:.2px;color:var(--w60)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;font-size:13px;color:rgba(255,255,255,.72);background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.10)}
.chip.on{color:#F5EBD9;background:#66523B;box-shadow:inset 0 0 0 .6px rgba(199,173,138,.55)}
.chip .i{font-size:11px;stroke-width:1.3}
.glab{font-size:11px;letter-spacing:1.25px;color:rgba(255,255,255,.46)}

/* ── PROFILE ── */
.phead{display:flex;align-items:center;padding:8px 24px 12px}
.phead h2{margin:0;font-size:24px;font-weight:400;color:var(--ivory)}
.probadge{margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--smoked);font-size:10px;font-weight:500;letter-spacing:1.5px;color:rgba(204,179,143,.90);--k:.72;--rw:.8px}
.probadge i{width:5px;height:5px;border-radius:50%;background:var(--champ);box-shadow:0 0 4px rgba(209,148,77,.55)}
.prow2{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;margin:0 20px;border-radius:16px;width:calc(100% - 40px);text-align:left}
.prow2.hero{gap:14px;min-height:76px;padding:16px 14px;border-radius:20px}
.prow2 .md{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 25% 25%,rgba(209,148,77,.24),#070605 70%);box-shadow:0 0 0 3px rgba(209,148,77,.10);color:var(--champ)}
.prow2.hero .md{width:38px;height:38px;box-shadow:0 0 0 3.5px rgba(209,148,77,.16);animation:shb 3.2s ease-in-out infinite}
.prow2 .tx{flex:1}
.prow2 .tx b{display:block;font-size:16px;font-weight:400;color:var(--ivory)}
.prow2.hero .tx b{font-size:18px}
.prow2 .tx span{font-size:12px;color:rgba(184,176,163,.82)}
.prow2 .ch{font-size:12px;color:rgba(204,179,143,.52);stroke-width:1.3}
.slab{padding:0 24px 8px;font-size:10.5px;letter-spacing:1.7px;color:rgba(204,179,143,.52)}
.about{margin:0 20px;border-radius:16px}
.about .r{display:flex;align-items:center;gap:12px;min-height:54px;padding:11px 14px;width:100%;text-align:left}
.about .r+.r{border-top:.6px solid rgba(204,179,143,.10);margin-left:0}
.about .r .md{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(209,148,77,.08),#070605 70%);color:rgba(204,179,143,.6)}
.about .r b{display:block;font-size:15px;font-weight:400;color:rgba(232,224,209,.86)}
.about .r span{font-size:11.5px;color:rgba(184,176,163,.64)}
.ro-k{font-family:var(--round);font-size:11px;font-weight:600;letter-spacing:2.8px;color:rgba(204,179,143,.78)}
.ro-stage{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.045);font-family:var(--round);font-size:11px;font-weight:600;letter-spacing:1.2px;color:var(--w94);box-shadow:inset 0 0 0 .55px rgba(204,179,143,.3)}
.ro-stage i{width:6px;height:6px;border-radius:50%;background:var(--wgold)}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.glance div{padding:14px;border-radius:17px;--p:.38}
.glance small{display:block;font-family:var(--round);font-size:11px;letter-spacing:1.5px;color:var(--w39);text-transform:uppercase}
.glance b{display:block;margin-top:6px;font-size:17px;font-weight:600;color:var(--w94)}

/* ── TAB BAR ── */
.tabbar{position:absolute;left:16px;right:16px;bottom:8px;height:61px;z-index:60;display:flex;border-radius:30px;background:var(--bar);box-shadow:inset 0 0 0 .7px rgba(255,255,255,.075)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(184,176,163,.62);transition:color .16s}
.tab .i{width:19px;height:18px;stroke-width:1.1}
.tab span{font-size:9.5px;font-weight:500;letter-spacing:.08px;color:rgba(255,255,255,.46);transition:color .16s}
.tab[aria-selected="true"],.tab[aria-selected="true"] span{color:var(--champ)}

.toast{position:absolute;left:50%;bottom:84px;z-index:130;transform:translate(-50%,16px);max-width:84%;width:max-content;padding:10px 16px;border-radius:16px;text-align:center;font-size:13px;color:var(--ivory);background:rgba(20,16,10,.94);box-shadow:inset 0 0 0 .6px rgba(204,179,143,.4),0 8px 20px rgba(0,0,0,.5);opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="island" aria-hidden="true"></div>
  <div class="sfade" id="sfade" aria-hidden="true"></div>
  <div class="status" aria-hidden="true"><span id="clock">9:41</span><span class="r">
    <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#fff"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#fff"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10 10 0 0 0 8 .6 10 10 0 0 0 .9 3.4L2 4.6a8.4 8.4 0 0 1 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.1-1.2A6.8 6.8 0 0 0 8 3.9a6.8 6.8 0 0 0-4.7 1.8l1.1 1.2c1-.9 2.2-1.4 3.6-1.4zm0 3.2a2 2 0 0 0-1.3.5L8 10.6l1.3-1.4A2 2 0 0 0 8 8.7z" fill="#fff"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="rgba(255,255,255,.4)" fill="none"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="rgba(255,255,255,.4)"/></svg>
  </span></div>

  <!-- HOME -->
  <section class="screen" id="home" aria-label="Home">
    <div class="wall" id="homeWall"></div>
    <div class="col">
      <div class="brand"><div class="wm">OVIO</div><div class="tag">Find your calm.</div></div>
      <div class="search" id="searchBox">
        <div class="halo"></div>
        <div class="ring"><label class="pillbox" for="homeSearch">
          <svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>
          <input id="homeSearch" type="search" enterkeyhint="search" aria-label="Search or ask OVIO" autocomplete="off">
        </label></div>
      </div>
      <div id="homeHero"></div>
      <div id="homeMoments"></div>
    </div>
  </section>

  <!-- DISCOVER -->
  <section class="screen" id="discover" aria-label="Discover" hidden>
    <div class="topbar">
      <h2>find my spot</h2>
      <button class="ctl" id="personaBtn" aria-label="Your persona"><span class="trim" id="personaCtl"></span></button>
      <button class="ctl" id="surpriseBtn" aria-label="Surprise me"><span class="trim"><svg class="i" viewBox="0 0 24 24" style="font-size:14px"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M18.5 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></span></button>
      <button class="ctl" id="refreshBtn" aria-label="Refresh"><span class="trim"><svg class="i" viewBox="0 0 24 24" style="font-size:17px"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></svg></span></button>
    </div>
    <div class="weather mrim" id="weather"><div class="row"><span class="l" id="wxL"></span><button class="t" id="wxT">72°</button></div></div>
    <div id="discBanner"></div>
    <div id="calmerSlot"></div>
    <div id="deckSlot"></div>
    <p class="attr gfoot">Places data from <b>Google</b></p>
  </section>

  <!-- CONCIERGE -->
  <section class="screen" id="concierge" aria-label="OVIO Concierge" hidden>
    <div class="bg" id="cBg"></div>
    <button class="cclose" id="cClose" aria-label="Close"><span><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>
    <div class="cwrap">
      <form class="aibox" id="aibox" autocomplete="off">
        <div class="glow"></div>
        <div class="surf">
          <div class="airow">
            <div class="jewel"><i></i></div>
            <div class="aitext" id="aitext">
              <textarea id="cInput" rows="1" aria-label="Ask OVIO"></textarea>
              <div class="ph" id="cPh"></div>
            </div>
            <button class="send" id="cSend" type="submit" aria-label="Send"><span><svg class="i" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span></button>
          </div>
          <div class="capt" id="cCapt"><b>OVIO CONCIERGE</b><i></i><span id="cCaptT">places · plans · moments</span></div>
        </div>
      </form>
      <div id="cBody"></div>
    </div>
  </section>

  <!-- SANCTUARIES -->
  <section class="screen" id="sanctuaries" aria-label="Sanctuaries" hidden></section>

  <!-- PROFILE -->
  <section class="screen" id="profile" aria-label="Profile" hidden></section>

  <nav class="tabbar" role="tablist" aria-label="Main">
    <button class="tab" role="tab" data-tab="home" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 6.5l5.5-2.5 7 2.5 5.5-2.5v13.5l-5.5 2.5-7-2.5L3 20z"/><path d="M8.5 4v13.5M15.5 6.5V20"/></svg><span>Home</span></button>
    <button class="tab" role="tab" data-tab="discover" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.2c0-.9.8-1.7 1.7-1.7h3.6c.9 0 1.7.8 1.7 1.7V7M3 12.5h18"/></svg><span>Discover</span></button>
    <button class="tab" role="tab" data-tab="concierge" aria-selected="false" aria-label="OVIO Concierge"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="3.6" rx="1.6" ry="1.5"/><path d="M4.1 16.3Q12 5.6 19.9 16.3M2.9 16.8h18.2M1.2 20.9h21.6"/></svg><span>OVIO</span></button>
    <button class="tab" role="tab" data-tab="sanctuaries" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M3 9l9-5 9 5M3.5 9h17M5.5 9v9M10 9v9M14 9v9M18.5 9v9M3 20.5h18"/></svg><span>Sanctuaries</span></button>
    <button class="tab" role="tab" data-tab="profile" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1.2-4 4.1-6 7.5-6s6.3 2 7.5 6"/></svg><span>Profile</span></button>
  </nav>

  <div class="scrim" id="scrim1"></div>
  <div class="sheet mrim" id="sheet1" role="dialog" aria-modal="true"><div class="scroll" id="sheet1s"></div></div>
  <div class="scrim stack2" id="scrim2"></div>
  <div class="sheet mrim stack2" id="sheet2" role="dialog" aria-modal="true"><div class="scroll" id="sheet2s"></div></div>
  <div class="scrim" id="ascrim" style="z-index:119"></div>
  <div class="asheet" id="asheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

function busyAt(v,h,dow){ // 0–100 or null (closed / no data)
  if(!v.bz) return null;
  var hr=hrsFor(v,dow); if(h<hr[0]||h>=hr[1]) return null;
  var b=v.bz, x=b[0]+(b[1]-b[0])*Math.exp(-Math.pow(h-b[2],2)/(2*b[3]*b[3]))+3*Math.sin(h*1.7+v.id.length);
  return Math.max(3,Math.min(97,Math.round(x)));
}
function envOf(v){return v.vouch&&v.vouch.n>=5?0.93:0.86;}
function scoreFrom(busy,v){return busy==null?null:Math.round(100*Math.pow(1-busy/100,0.6)*Math.pow(envOf(v),0.4));}
function isOpen(v){return openAtMin(v,NOWM,DOW);}
function score(v){ if(!v.bz||!isOpen(v)) return null; return scoreFrom(busyAt(v,Math.floor(NOWM/60),DOW),v); }
function fmtH(h,short){h=((h%24)+24)%24;var m=Math.round((h%1)*60),H=Math.floor(h);var ap=H<12?"AM":"PM",x=H%12||12;
  if(short){return (H===12&&!m)?"12p":(H===0&&!m)?"12a":x+(m?":"+(m<10?"0":"")+m:"")+(H<12?"a":"p");}
  return x+(m?":"+(m<10?"0":"")+m:"")+" "+ap;}
function rangeTxt(h){return h[0]===0&&h[1]===24?"Open 24 hours":fmtH(h[0])+"–"+fmtH(h[1]);}
function openState(v){ // null when simply open
  var h=hrsFor(v,DOW); if(h[0]===0&&h[1]===24) return null;
  var o=h[0]*60,c=h[1]*60;
  if(NOWM>=o&&NOWM<c){ var left=c-NOWM; if(left<=60) return {k:"soon",tint:"255,183,77",icon:"clock",t:"closes "+fmtH(h[1])+" · "+left+" min"}; return null; }
  if(NOWM<o){ var until=o-NOWM; if(until<=60) return {k:"opens",tint:"99,176,245",icon:"clockArr",t:"opens "+fmtH(h[0])+" · "+until+" min"}; return {k:"closed",tint:"201,123,84",icon:"lockF",t:"closed · opens "+fmtH(h[0])}; }
  var nh=hrsFor(v,(DOW+1)%7); return {k:"closed",tint:"201,123,84",icon:"lockF",t:"closed · opens "+fmtH(nh[0])+" tomorrow"};
}
function pillHTML(st){return st?'<span class="pill" style="color:rgba('+st.tint+',.92);background:rgba('+st.tint+',.12);box-shadow:inset 0 0 0 .5px rgba('+st.tint+',.30)">'+I(st.icon)+esc(st.t)+'</span>':"";}
function band(s){return s==null?null:s>=80?"233,217,174":s>=60?"223,200,148":s>=40?"192,130,69":"201,123,84";}
function vibe(s){return s==null?null:s>=80?"Very Calm":s>=60?"Mostly Comfortable":s>=40?"A Bit Active":s>=20?"Quite Busy":"Very Crowded";}
function miles(v){return v.mi.toFixed(1)+" miles";}
function mi(v){return v.mi.toFixed(1)+" mi";}
// 18-hour outlook anchored so "now" equals the live score
function outlook(v){
  var pts=[],live=score(v),h0=Math.floor(NOWM/60),busy0=busyAt(v,h0,DOW),off=(live!=null&&busy0!=null)?live-(100-busy0):0;
  for(var i=0;i<18;i++){var H=h0+i,d=H>=24?(DOW+1)%7:DOW,hh=H%24,b=busyAt(v,hh,d),closed=!openAtMin(v,hh*60+30,d);
    pts.push({i:i,h:hh,tmw:H>=24,closed:closed,s:(b==null||closed)?null:Math.max(2,Math.min(98,100-b+off))});}
  return {pts:pts,anchored:live!=null};
}
function bestWindow(v){
  var o=outlook(v).pts,now=o[0].s; if(now==null) return null;
  var best=-1,bi=-1; for(var i=1;i<10;i++){if(o[i].s!=null&&o[i].s>best){best=o[i].s;bi=i;}}
  if(bi<0||best<now+5) return null;
  var a=bi,b=bi; while(a>1&&o[a-1].s!=null&&o[a-1].s>=best-6)a--; while(b<17&&o[b+1].s!=null&&o[b+1].s>=best-6)b++;
  return {from:o[a].h,to:o[b].h+1,len:b-a+1,peak:o[bi].h};
}
function calmerLine(v){
  if(!v.bz) return "Not enough history to call it yet";
  if(!isOpen(v)){var h=hrsFor(v,DOW);return NOWM<h[0]*60?"Opens "+fmtH(h[0]):"Opens "+fmtH(hrsFor(v,(DOW+1)%7)[0])+" tomorrow";}
  var w=bestWindow(v); if(w) return w.len>=2?"Best window · "+fmtH(w.from)+"–"+fmtH(w.to):"Best around "+fmtH(w.peak);
  return "A steady outlook for the hours ahead";
}

/* ════════ Day curve (area + line, like Swift Charts) ════════ */
function smoothPath(pts){ // monotone-ish Catmull-Rom
  if(pts.length<2) return "";
  var d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    var lo=Math.min(p1[1],p2[1]),hi=Math.max(p1[1],p2[1]);c1y=Math.max(lo,Math.min(hi,c1y));c2y=Math.max(lo,Math.min(hi,c2y));
    d+=" C"+c1x.toFixed(1)+" "+c1y.toFixed(1)+" "+c2x.toFixed(1)+" "+c2y.toFixed(1)+" "+p2[0].toFixed(1)+" "+p2[1].toFixed(1);}
  return d;
}
var cuid=0;

  g+='<defs><linearGradient id="'+id+'a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FACC8C" stop-opacity=".28"/><stop offset=".44" stop-color="#D1944D" stop-opacity=".12"/><stop offset=".82" stop-color="#704521" stop-opacity=".035"/><stop offset="1" stop-color="#704521" stop-opacity="0"/></linearGradient>'+
     '<linearGradient id="'+id+'l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6B8" stop-opacity=".98"/><stop offset=".5" stop-color="#FACC8C"/><stop offset="1" stop-color="#D1944D" stop-opacity=".9"/></linearGradient>'+
     '<linearGradient id="'+id+'w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D1944D" stop-opacity=".02"/><stop offset=".5" stop-color="#D1944D" stop-opacity=".14"/><stop offset="1" stop-color="#D1944D" stop-opacity=".025"/></linearGradient>'+
     '<linearGradient id="'+id+'n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>';
  for(var t=0;t<=16;t+=4){g+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+top+'" y2="'+bot+'" stroke="#fff" stroke-opacity=".055" stroke-width=".55" stroke-dasharray="2 6"/>';}
  var w=bestWindow(v);
  if(w){var ia=null,ib=null;o.pts.forEach(function(p){if(p.h===w.from&&ia==null)ia=p.i;if(p.h===w.to-1)ib=p.i;});
    if(ia!=null&&ib!=null)g+='<rect x="'+X(ia-0.48)+'" y="0" width="'+(X(ib+0.48)-X(ia-0.48))+'" height="'+H+'" fill="url(#'+id+'w)"/>';}
  // closed runs
  var runs=[],cur=null;o.pts.forEach(function(p){if(p.closed){if(!cur)cur={a:p.i,b:p.i};cur.b=p.i;}else if(cur){runs.push(cur);cur=null;}});if(cur)runs.push(cur);
  runs.forEach(function(r){var x0=Math.max(0,X(r.a-0.48)),x1=Math.min(W,X(r.b+0.48));g+='<rect x="'+x0+'" y="0" width="'+(x1-x0)+'" height="'+H+'" fill="#000" fill-opacity=".32"/>';
    if(r.b-r.a>=2){var nxt=o.pts[r.b+1],lab=nxt?"CLOSED · OPENS "+(nxt.h===12?"NOON":nxt.h===0?"MIDNIGHT":fmtH(nxt.h).toUpperCase()):"CLOSED";
      g+='<text x="'+((x0+x1)/2)+'" y="'+(top+16)+'" text-anchor="middle" font-family="Georgia,serif" font-size="8" letter-spacing=".85" fill="#fff" fill-opacity=".34">'+lab+'</text>';}});
  // readable runs → area + glow + line
  var seg=[],segs=[];o.pts.forEach(function(p){if(p.s!=null)seg.push([X(p.i),Y(p.s)]);else if(seg.length){segs.push(seg);seg=[];}});if(seg.length)segs.push(seg);
  segs.forEach(function(s){
    if(s.length===1){g+='<circle cx="'+s[0][0]+'" cy="'+s[0][1]+'" r="2" fill="#FACC8C"/>';return;}
    var line=smoothPath(s);

    g+='<path d="'+line+'" fill="none" stroke="#D1944D" stroke-opacity=".10" stroke-width="5"/>';
    g+='<path d="'+line+'" fill="none" stroke="url(#'+id+'l)" stroke-width="1.75" stroke-linecap="round"/>';
  });
  if(o.pts[0].s!=null){var x=X(0),y=Y(o.pts[0].s);
    g+='<rect x="'+(x-.35)+'" y="'+top+'" width=".7" height="'+(bot-top)+'" fill="url(#'+id+'n)"/>';
    g+='<circle class="nowdot" cx="'+x+'" cy="'+y+'" r="3.5" fill="#FACC8C" style="filter:drop-shadow(0 0 4px rgba(209,148,77,.72))"/>';}
  for(var k=0;k<=16;k+=4){var p=o.pts[k];g+='<text x="'+X(k)+'" y="'+(H-5)+'" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#fff" fill-opacity=".38">'+fmtH(p.h,true)+'</text>';}
  return '<div class="dc-head"><span class="a">THE DAY AHEAD</span><span class="b">'+(o.anchored?"OVIO OUTLOOK":"CROWD OUTLOOK")+'</span></div>'+
    '<div class="dc-plot"><svg class="reveal" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Calm over the next 18 hours. Higher is calmer.">'+g+'</svg></div>'+
    '<div class="dc-ins">'+esc(calmerLine(v))+'</div>';
}

function drag(el){

  el.addEventListener("pointerdown",function(e){if(e.target.closest("button,[data-hours]"))return;down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=dy=0;el.setPointerCapture(e.pointerId);el.style.transition="none";});
  el.addEventListener("pointermove",function(e){if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)>10)moved=true;if(!moved)return;
    var rot=Math.max(-4,Math.min(4,dx/70));el.style.transform="translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)";el.style.opacity=String(Math.max(.5,1-Math.abs(dx)/800));});
  function up(){if(!down)return;down=false;
    if(!moved){openWhy(el.dataset.card);return;}
    var lim=Math.min(160,el.offsetWidth*.45);
    if(Math.abs(dx)>lim) advance(dx>0?1500:-1500,dy); else if(dy<-lim) advance(0,-1500);
    else{el.style.transition=reduce?"none":"transform .5s cubic-bezier(.34,1.45,.64,1), opacity .3s";el.style.transform="none";el.style.opacity="1";}}
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}

/* — Why This Place — */
function signals(v){
  var out=[],s=score(v),hr=NOWM/60;
  // Daylight
  var dl=hr>=5&&hr<7.5?["early light · soft and pale",5]:hr>=17&&hr<20?["warm, fading light right now",5]:(hr>=20||hr<5)?["after-dark stillness · low ambient light",3]:
    v.light==="Very Soft"?["soft, low-stimulation light · diffuse and even",4]:v.light==="Soft"?["muted, diffuse light right now",3]:["clear, even daylight",2];
  out.push({icon:"sun",label:"Daylight",t:dl[0],d:dl[1]});
  // Calm window
  if(s!=null){var w=bestWindow(v);
    if(w) out.push({icon:"clock",label:"Calm window",t:"quietest around "+fmtH(w.peak)+(w.len>=2?" · stays for ~"+w.len+" hours":""),d:w.len>=3?5:w.len===2?4:3});
    else if(s>=40){var o=outlook(v).pts,nx=o[1].s,nx2=o[2].s;
      var t=s<60?["steady through the next hour · neither rising nor falling",2]:(nx!=null&&nx2!=null&&nx>=s-5&&nx2>=s-5)?["expected to stay calm for the next couple of hours",4]:(nx!=null&&nx<=s-15)?["calm now · likely picking up within the hour",2]:["steady through the next hour",3];
      out.push({icon:"clock",label:"Calm window",t:t[0],d:t[1]});}}
  // Observations
  var vo=v.vouch||{n:0};
  if(!vo.n) out.push({icon:"bubble",label:"Observations",t:"no ovio observations yet · share your read",d:1});
  else{var tail=vo.n===1?" · 1 observation · early read":vo.n<=4?" · "+vo.n+" observations · early read":" · "+vo.n+" observations";
    var fr=(vo.good||[]).slice(0,2).map(function(k){return STRENGTH[k];}); if(vo.bad) fr.push(CONCERN[vo.bad]);
    out.push({icon:"bubble",label:"observations",t:fr.join(" · ")+tail,d:vo.n>=10?5:vo.n>=5?4:3});}
  if(v.timing) out.push({icon:"clock",label:"Timing",t:v.timing,d:3});
  // Heads up (anti-signal)
  if(!v.bz) out.push({icon:"info",label:"Heads up",t:"less data on this venue than usual · verify in person",anti:true});
  else if(s!=null&&s<50) out.push({icon:"info",label:"Heads up",t:"lively right now · verify if you want quiet",anti:true});
  else if(!isOpen(v)) out.push({icon:"info",label:"Heads up",t:"closed right now · score returns when it opens",anti:true});
  return out;
}

  if(d.save!==undefined){e.stopPropagation();toggleSave(d.save);return;}
  if(d.why){openWhy(d.why);return;}
  if(d.hours){openHoursSheet(d.hours,1);return;}
  if(d.moment){S.moment=d.moment;S.surprise=false;buildDeck();show("discover");return;}
  if(d.clearmoment!==undefined){S.moment=null;buildDeck();renderDiscover();return;}
  if(d.surprise!==undefined){S.surprise=false;buildDeck();renderDiscover();return;}
  if(d.restart!==undefined){buildDeck();renderDeck();return;}
  if(d.badge){t.classList.toggle("open");if(t.classList.contains("open")){t.innerHTML=I(d.badge==="surp"?"sparkle":"personF")+(d.badge==="surp"?"off your usual path":"matches: "+esc(SL[d.badge][1]));var el=t;setTimeout(function(){el.classList.remove("open");el.innerHTML=I(d.badge==="surp"?"sparkle":"personF");},4000);}else t.innerHTML=I(d.badge==="surp"?"sparkle":"personF");return;}
  if(d.toggle){var c=$(d.toggle),b=c.querySelector(".disc-b"),open=b.hidden;b.hidden=!open;c.classList.toggle("open",open);return;}
  if(d.go){var id=d.go;closeAll();setTimeout(function(){takeMeThere(id);},200);return;}
  if(d.maps!==undefined){closeAS();if(d.maps){S.mapsApp=d.maps;save();toast("Opening "+d.maps+" to "+BY[d.v].name);}return;}
  if(d.detail){openDetail(d.detail);return;}
  if(d.vouch){openVouch(d.vouch);return;}
  if(d.hoursheet){openHoursSheet(d.hoursheet,2);return;}
  if(d.share!==undefined){toast("Share sheet opens here in the app");return;}
  if(d.remove){var nm=BY[d.remove].name;S.saved=S.saved.filter(function(x){return x!==d.remove;});save();closeSheet(1);renderSanct();toast(nm+" removed");return;}
  if(d.vsel){VS.sel=d.vsel;renderVouch();return;}
  if(d.more!==undefined){VS.more=!VS.more;renderVouch();return;}
  if(d.vcancel!==undefined){closeSheet(2);VS=null;return;}
  if(d.vshare!==undefined){var now=new Date(),hh=now.getHours()%12||12,mm=now.getMinutes();VS.pending=hh+":"+(mm<10?"0":"")+mm+" "+(now.getHours()<12?"AM":"PM");renderVouch();
    VS.timer=setTimeout(function(){var v=BY[VS.id],sent=Object.keys(VS.vals).length;closeSheet(2);toast("Thanks. Your read on "+v.name+" is in"+(sent?" ("+sent+" detail"+(sent===1?"":"s")+")":"")+".");VS=null;},6000);return;}
  if(d.undo!==undefined){clearTimeout(VS.timer);VS.pending=null;renderVouch();return;}
  if(d.pstate){var i=PS.sel.indexOf(d.pstate);if(i>=0)PS.sel.splice(i,1);else{PS.sel.push(d.pstate);if(PS.sel.length>3)PS.sel.shift();}renderPersona();return;}
  if(d.pref){var j=PS.prefs.indexOf(d.pref);if(j>=0)PS.prefs.splice(j,1);else PS.prefs.push(d.pref);renderPersona();return;}
  if(d.pcancel!==undefined){closeSheet(1);return;}
  if(d.psave!==undefined){S.persona=PS.sel.slice();S.prefs=PS.prefs.slice();save();closeSheet(1);S.surprise=false;buildDeck();renderDiscover();toast(S.persona.length?"Your deck now leans toward what you chose":"Persona cleared");return;}
  if(d.tabgo){show(d.tabgo);return;}
  if(d.clar){CS.plan=PLANS[d.clar];var btn=t;btn.parentNode.querySelectorAll(".copt").forEach(function(o){if(o!==btn)o.style.opacity=.34;});setTimeout(function(){CS.state="revealed";renderConcierge();},300);return;}
  if(d.insights){openWhy(d.insights);return;}
  if(d.chours){CS.hours[d.chours]=!CS.hours[d.chours];var y=$("concierge").scrollTop;renderConcierge();$("concierge").scrollTop=y;return;}
  if(d.report!==undefined){t.textContent="Reported";t.style.color="rgba(255,255,255,.3)";toast("Thanks. Reports help correct the model.");return;}
  if(d.consent!==undefined){S.consent=true;save();closeSheet(1);if(d.consent)setTimeout(function(){ask(d.consent);},300);return;}
  if(d.noconsent!==undefined){closeSheet(1);show("home");return;}
  if(d.resetasks!==undefined){S.asks=0;CS.state="idle";renderConcierge();return;}
  if(d.pro!==undefined){toast("The Pro paywall opens here in the app");return;}
  if(d.readout!==undefined){openReadout();return;}
  if(d.settings!==undefined||d.about!==undefined){toast("Not part of this simulator");return;}
});
document.addEventListener("input",function(e){var s=e.target.closest("[data-slider]");if(!s||!VS)return;VS.vals[s.dataset.slider]=+s.value;s.style.setProperty("--v",s.value+"%");});
["scrim1","scrim2"].forEach(function(id,i){$(id).addEventListener("click",function(){if(i===1&&VS){clearTimeout(VS.timer);VS=null;}closeSheet(i+1);});});
$("ascrim").addEventListener("click",closeAS);
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("sheet2").classList.contains("on"))closeSheet(2);else closeAll();}});
$("personaBtn").onclick=openPersona;
$("surpriseBtn").onclick=function(){S.surprise=!S.surprise;S.moment=null;buildDeck();renderDiscover();};
$("refreshBtn").onclick=function(){S.refreshing=true;renderDeck();setTimeout(function(){S.refreshing=false;buildDeck();renderDeck();},1500);};
$("wxT").onclick=function(){var t=$("wxT");t.textContent=t.textContent==="72°"?"22°":"72°";};
$("aibox").addEventListener("submit",function(e){e.preventDefault();submitAsk();});
$("cClose").onclick=function(){show("home");};
$("homeSearch").addEventListener("keydown",function(e){if(e.key==="Enter"){var q=this.value;this.value="";this.blur();show("concierge");setTimeout(function(){ask(q);},S.consent?50:0);}});

/* boot */
$("homeWall").style.backgroundImage="url(data:image/jpeg;base64,"+A.wall+")";
$("cBg").style.display="none";$("concierge").style.background="linear-gradient(rgba(0,0,0,.30),rgba(0,0,0,.30)),url(data:image/jpeg;base64,"+A.wall+") center/cover no-repeat,#14100A";
$("cPh").textContent=phText();bindInput();
phTimer=setInterval(function(){var ta=$("cInput");if(S.tab==="concierge"&&ta&&!ta.value&&document.activeElement!==ta)rotatePH();},4000);
clock();setInterval(clock,20000);
buildDeck();show("home");
setTimeout(function(){toast("OVIO simulator · sample places, nothing here is live");},600);
})();

</script>
